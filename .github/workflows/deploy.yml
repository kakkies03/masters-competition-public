# マスターズ大会一覧（swim.freakers.net）を作って公開する
# ・mainにコミットしたとき
# ・毎日 朝5時（日本時間）
# ・Actions画面の「Run workflow」ボタンを押したとき
name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ページを作る
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
